<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Joke Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f9;
      padding: 50px;
    }

    h1 {
      color: #333;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      background: #ff6b6b;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #ff3b3b;
    }

    input {
      padding: 10px;
      width: 300px;
      margin: 10px;
    }

    #joke {
      font-size: 20px;
      margin-top: 20px;
      color: #444;
    }

    #message {
      color: green;
    }
  </style>
</head>
<body>

  <h1>😂 Random Joke Generator</h1>

  <!-- Button to get random joke -->
  <button onclick="getJoke()">Get Random Joke</button>
  <p id="joke">Click the button to see a joke!</p>

  <hr>

  
  <script>
    // Fetch a random joke
    async function getJoke() {
      try {
        const res = await fetch('/api/joke');
        const data = await res.json();
        document.getElementById('joke').innerText = data.joke;
      } catch (err) {
        document.getElementById('joke').innerText = "Error fetching joke";
      }
    }

    
  </script>

</body>
</html>
